<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030507">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <title>Tabela de preços</title>
  <script type="module" src="/app.js?v=10"></script>
</head>
<body>
  <div class="snowfall" aria-hidden="true">
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
    <span>❄</span>
  </div>
  <header><div class="wrap bar"><div class="brand"><img src="/logo.png" alt="LD" width="44" height="44"><strong>Tabela de preços</strong></div><a href="/admin">Administração</a></div></header>
  <main class="wrap">
    <section id="install" class="panel install" aria-labelledby="install-title" hidden>
      <h2 id="install-title">Instale a tabela de preços</h2>
      <p id="install-help"></p>
      <div class="actions">
        <button id="install-button" type="button">Instalar</button>
        <button class="secondary" id="dismiss-install" type="button">Agora não</button>
      </div>
    </section>
    <div class="title">
      <h1>Catálogo de preços</h1>
      <button id="show-install" class="secondary" type="button" hidden>Instalar app</button>
    </div>
    <label for="search">Buscar item ou categoria</label>
    <input id="search" type="search" placeholder="Digite para buscar">
    <p class="muted" id="status" role="status">Carregando catálogo…</p>
    <div id="categories"></div>
  </main>
  <footer class="wrap share-footer" id="share-footer" hidden>
    <details class="share-panel">
      <summary>Compartilhar tabela de preços</summary>
      <div class="share-controls">
        <fieldset>
          <legend>Escolha as categorias</legend>
          <button type="button" class="secondary" id="share-all">Todas as categorias</button>
          <div id="share-categories"></div>
        </fieldset>
        <div class="actions">
          <button type="button" id="share-generate" disabled>Gerar PDF</button>
          <button type="button" id="share-whatsapp" hidden>Compartilhar PDF pelo WhatsApp</button>
        </div>
        <p id="share-status" role="status"></p>
        <div id="share-downloads"></div>
        <p class="muted" id="share-document-help" hidden>Se o WhatsApp mostrar uma imagem, toque em Baixar PDF e, no WhatsApp, escolha Anexar → Documento.</p>
      </div>
    </details>
  </footer>
</body>
</html>
